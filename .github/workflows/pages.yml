name: Publish N5 study room

on:
  push:
    branches: [main]
    paths: [.github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: n5-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch and verify the N5 course
        env:
          COURSE_URL: https://n5-30-day-study.zhoujinhangz.chatgpt.site/n5-pages-v2.zip
          COURSE_SHA: 38b2b05a83deeb6619665445f707887cb3fd80cae76658125ea59b5f0f16d24e
        run: |
          curl --fail --show-error --silent --location --retry 2 --max-time 90 --output n5-pages.zip "$COURSE_URL"
          printf '%s  n5-pages.zip\n' "$COURSE_SHA" | sha256sum --check
          unzip -q n5-pages.zip -d _site
          test -s _site/index.html
          test -s _site/plan.xlsx
          test -s _site/audio/l01-b-01.mp3
          test -s _site/audio/l24-dialogue.mp3
          test "$(find _site -maxdepth 1 -name 'Day*.zip' | wc -l)" -eq 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
