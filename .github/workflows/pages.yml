name: Publish N5 study room

on:
  push:
    branches: [main]
    paths: [.github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: n5-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Fetch and verify the N5 course
        env:
          COURSE_URL: https://n5-30-day-study.zhoujinhangz.chatgpt.site/n5-pages.zip
          COURSE_SHA: 54261e6fe1d67c7d73d172322e51662283cc9583d6447c301a152bbd1c9ac895
        run: |
          curl --fail --show-error --silent --location --retry 2 --max-time 30 --output n5-pages.zip "$COURSE_URL"
          printf '%s  n5-pages.zip\n' "$COURSE_SHA" | sha256sum --check
          unzip -q n5-pages.zip -d _site
          test -s _site/index.html
          test -s _site/plan.xlsx
          test "$(find _site -maxdepth 1 -name 'Day*.zip' | wc -l)" -eq 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: publish
        uses: actions/deploy-pages@v4
